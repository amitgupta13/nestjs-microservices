services:
  e2e:
    build:
      dockerfile: ./Dockerfile
    volumes:
      - ./specs:/usr/src/app/specs
    depends_on:
      - reservations
      - auth
      - notifications
      - payments
      - mongo
  reservations:
    image: amitkrgupta13/reservations
    env_file:
      - ../apps/reservations/.env
    ports:
      - '3000:3000'
  auth:
    image: amitkrgupta13/auth
    env_file:
      - ../apps/auth/.env
    ports:
      - '3001:3001'
  payments:
    image: amitkrgupta13/nest-payments
    env_file:
      - ../apps/payments/.env
    ports:
      - '3003:3003'
  notifications:
    image: amitkrgupta13/notifications
    env_file:
      - ../apps/notifications/.env
    ports:
      - '3004:3004'
  mongo:
    image: mongo
